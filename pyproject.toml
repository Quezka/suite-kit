[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quezka-ui"
dynamic = ["version"]
description = "The Quire suite's shared interface toolkit (PySide6): theme, icons, translations, scaling, page widgets"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[tool.setuptools.dynamic]
version = {attr = "quezka_ui.__version__"}

[tool.setuptools.packages.find]
include = ["quezka_ui*"]

[tool.setuptools.package-data]
quezka_ui = ["assets/*"]
